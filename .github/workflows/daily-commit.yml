name: Daily Empty Commit

on:
  schedule:
    - cron: "30 16 * * *"   # 10:00 PM IST
  workflow_dispatch:

permissions:
  contents: write

jobs:
  daily-commit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create empty commit
        run: |
          git config user.name "mitarthpathak"
          git config user.email "97668137+mitarthpathak@users.noreply.github.com"
          git commit --allow-empty -m "chore: daily activity"
          git push
